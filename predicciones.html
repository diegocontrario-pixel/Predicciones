<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predicciones — Marcador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-dark:#0e2b27;
    --felt:#153a34;
    --felt-light:#1f4c43;
    --gold:#d4a24c;
    --gold-soft:#e8c98a;
    --coral:#e0604f;
    --cream:#f4efe3;
    --muted:#8fb0a6;
    --line: rgba(244,239,227,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(212,162,76,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(224,96,79,0.08), transparent 55%),
      var(--felt-dark);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:22px; flex-wrap:wrap;
  }
  .brand h1{font-size:28px; letter-spacing:0.3px;}
  .brand h1 em{color:var(--gold); font-style:normal;}
  .brand .tag{color:var(--muted); font-size:13px;}
  .card{
    background:linear-gradient(180deg, var(--felt-light), var(--felt));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=number], select{
    width:100%;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:9px;
    padding:10px 12px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  select option{
    background:#fdfdfa;
    color:#1c1206;
  }
  select option:disabled{
    color:#9a9a9a;
  }
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:140px;}
  button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    font-size:14px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--gold); color:#1c1206;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid var(--line);}
  .btn-ghost:hover{background:rgba(244,239,227,0.06);}
  .btn-danger{background:transparent; color:var(--coral); border:1px solid rgba(224,96,79,0.4);}
  .btn-danger:hover{background:rgba(224,96,79,0.1);}
  .setup-players{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; margin:14px 0;}
  .setup-players input{max-width:100%;}
  .name-slot{display:flex; flex-direction:column; align-items:center; gap:8px; background:rgba(0,0,0,0.15); border:1px solid var(--line); border-radius:12px; padding:14px 10px;}
  .name-slot select{width:100%;}
  .name-slot input{width:100%;}
  .avatar{border-radius:50%; object-fit:cover; display:block; background:var(--felt); border:1px solid var(--line);}
  .avatar-placeholder{display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; color:var(--muted); background:rgba(0,0,0,0.25);}
  .avatar-inline{display:inline-flex; vertical-align:middle; margin-right:8px;}
  .avatar-big{box-shadow:0 6px 18px rgba(0,0,0,0.35); border-width:2px;}

  /* round track */
  .track{display:flex; gap:6px; overflow-x:auto; padding:4px 2px 14px; margin-bottom:6px;}
  .track::-webkit-scrollbar{height:6px;}
  .track::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .chip{
    flex:0 0 auto;
    min-width:44px;
    text-align:center;
    padding:6px 8px;
    border-radius:8px;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    border:1px solid var(--line);
    background:rgba(0,0,0,0.15);
    white-space:nowrap;
  }
  .chip.done{color:var(--felt-dark); background:var(--muted); border-color:var(--muted); cursor:pointer;}
  .chip.done:hover{filter:brightness(1.1);}
  .chip.current{color:#1c1206; background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,162,76,0.2);}

  .round-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:6px;}
  .round-title h2{font-size:22px;}
  .round-sub{color:var(--muted); font-size:13px;}
  .phase-badge{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    padding:4px 10px; border-radius:20px; border:1px solid var(--gold); color:var(--gold);
  }

  .player-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .player-row:last-child{border-bottom:none;}
  .player-name{flex:1; font-weight:600; display:flex; align-items:center; gap:8px;}
  .mano-badge{
    font-size:10px; background:var(--gold); color:#1c1206; padding:2px 7px; border-radius:20px; font-weight:700;
    letter-spacing:0.04em;
  }
  .player-row input{width:90px; text-align:center;}
  .forbidden-note{font-size:12px; color:var(--coral); margin-top:4px;}

  .scoreboard{margin-top:6px;}
  .score-row{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .score-row:last-child{border-bottom:none;}
  .pos{width:24px; color:var(--muted); font-family:'Fraunces',serif; font-size:16px;}
  .score-name{flex:1; font-weight:600;}
  .score-pts{font-family:'Fraunces',serif; font-size:20px; color:var(--gold-soft);}
  .score-diff{font-size:12px; color:var(--muted); min-width:70px; text-align:right;}
  .queso{font-size:11px; color:var(--coral); margin-left:6px;}
  .leader-tag{font-size:11px; color:var(--gold-soft); margin-left:6px; font-weight:600;}

  details{margin-top:8px;}
  summary{cursor:pointer; color:var(--muted); font-size:13px; padding:6px 0;}
  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  th,td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;}
  td:first-child, th:first-child{text-align:left;}

  .footer-actions{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .empty-note{color:var(--muted); font-size:13px; text-align:center; padding:8px 0;}
  .sync-note{color:var(--muted); font-size:11px; text-align:center; margin-top:18px;}

  /* animación de inicio de partida */
  #introOverlay{
    position:fixed; inset:0; z-index:9999;
    background: radial-gradient(ellipse at center, rgba(212,162,76,0.14), var(--felt-dark) 72%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    animation: introBgIn 0.25s ease;
  }
  #introOverlay.intro-fadeout{ animation: introFadeOut 0.45s ease forwards; }
  @keyframes introBgIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes introFadeOut{ to{opacity:0;} }
  .intro-grid{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:28px 36px; max-width:720px; padding:0 24px; position:relative; z-index:1;
  }
  .intro-player{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    opacity:0; transform:scale(0.25);
    animation: introPop 0.55s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  .intro-left{ animation-name: introPopLeft; }
  .intro-right{ animation-name: introPopRight; }
  @keyframes introPopLeft{
    0%{opacity:0; transform:translateX(-120px) scale(0.3) rotate(-10deg);}
    60%{opacity:1; transform:translateX(10px) scale(1.15) rotate(3deg);}
    100%{opacity:1; transform:translateX(0) scale(1) rotate(0);}
  }
  @keyframes introPopRight{
    0%{opacity:0; transform:translateX(120px) scale(0.3) rotate(10deg);}
    60%{opacity:1; transform:translateX(-10px) scale(1.15) rotate(-3deg);}
    100%{opacity:1; transform:translateX(0) scale(1) rotate(0);}
  }
  .intro-player img, .intro-player .avatar{
    width:110px !important; height:110px !important;
    border:3px solid var(--gold) !important;
    box-shadow:0 0 30px rgba(212,162,76,0.5);
  }
  .intro-name{
    font-family:'Fraunces', serif; font-weight:700; font-size:17px;
    color:var(--cream); text-transform:uppercase; letter-spacing:0.06em;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .intro-vs{
    position:absolute; top:50%; left:50%; z-index:2;
    font-family:'Fraunces', serif; font-weight:700; font-size:72px;
    color:var(--coral);
    text-shadow:0 0 24px rgba(224,96,79,0.85), 0 0 50px rgba(224,96,79,0.4);
    opacity:0; transform:translate(-50%,-50%) scale(3) rotate(-16deg);
    animation: vsSlam 0.55s 0.85s cubic-bezier(.34,1.6,.5,1) forwards;
  }
  @keyframes vsSlam{
    0%{opacity:0; transform:translate(-50%,-50%) scale(3) rotate(-16deg);}
    60%{opacity:1; transform:translate(-50%,-50%) scale(0.85) rotate(6deg);}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);}
  }

  /* modal de confirmación propio (no depende de confirm() del navegador) */
  #confirmOverlay{
    position:fixed; inset:0; z-index:10000;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: introBgIn 0.15s ease;
  }
  .confirm-box{
    background:linear-gradient(180deg, var(--felt-light), var(--felt));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .confirm-msg{color:var(--cream); font-size:15px; line-height:1.5; margin-bottom:18px;}
  .confirm-actions{display:flex; justify-content:flex-end; gap:10px;}
</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAD0Z2DQTEIuLzmxTrdflwogZr_0RakBns",
  authDomain: "predicciones-marcador.firebaseapp.com",
  databaseURL: "https://predicciones-marcador-default-rtdb.firebaseio.com",
  projectId: "predicciones-marcador",
  storageBucket: "predicciones-marcador.firebasestorage.app",
  messagingSenderId: "140977960387",
  appId: "1:140977960387:web:fc5e14b2a2d60eddf37976"
};
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseReady = true;
}catch(e){ console.error('Firebase init error', e); }

const dbStorage = {
  async get(key){
    if(!firebaseReady) throw new Error('Firebase no disponible');
    const snap = await firebase.database().ref(key).once('value');
    const val = snap.val();
    return (val !== null && val !== undefined) ? { key, value: val } : null;
  },
  async set(key, value){
    if(!firebaseReady) throw new Error('Firebase no disponible');
    await firebase.database().ref(key).set(value);
    return { key, value };
  }
};

const SPECIALS_3 = ['Sin comodín','Ciego','Perder'];
const SPECIALS_N = ['Sin comodín','Ciego','Perder','Elige'];

function buildRounds(numPlayers){
  const specials = numPlayers === 3 ? SPECIALS_3 : SPECIALS_N;
  const down = [7,6,5,4,3,2,1].map(m => ({manos:m, label:`${m} carta${m===1?'':'s'}`, short:`${m}`}));
  const spec = specials.map(name => ({manos:7, label:`7 · ${name}`, short:name, kind: name === 'Perder' ? 'perder' : undefined}));
  const up = [1,2,3,4,5,6,7].map(m => ({manos:m, label:`${m} carta${m===1?'':'s'}`, short:`${m}`}));
  return [...down, ...spec, ...up];
}

function emptyState(){
  return { phase:'setup', players:[], startDealer:0, rounds:[], roundIdx:0,
           predicciones:{}, resultados:{}, history:[] };
}

let state = emptyState();
let localDraft = {}; // unsynced input values while typing
let viewRoundIdx = null; // round history panel currently open (not persisted)

function isPerderRound(round){
  return !!(round && round.short === 'Perder');
}

function pts(pred, real, round){
  if(real === null || real === undefined || real === '') return null;
  real = Number(real);
  if(isPerderRound(round)){
    if(real === 0) return 10;
    return -2 * real;
  }
  if(pred === real) return 10 + 2*real;
  return 2*real;
}

function totals(){
  const t = {};
  state.players.forEach((p,i)=> t[i] = 0);
  state.history.forEach(round=>{
    state.players.forEach((p,i)=>{
      const s = round.scores[i];
      if(typeof s === 'number') t[i]+=s;
    });
  });
  return t;
}

function healHistory(){
  let changed = false;
  state.history.forEach((h, idx)=>{
    const round = state.rounds[idx];
    if(round && isPerderRound(round)){
      state.players.forEach((_,i)=>{
        const correct = pts(h.predicciones[i], h.resultados[i], round);
        if(h.scores[i] !== correct){
          h.scores[i] = correct;
          changed = true;
        }
      });
    }
  });
  return changed;
}

function render(){
  const app = document.getElementById('app');
  const topReset = document.getElementById('topReset');
  if(topReset) topReset.style.display = (state.phase === 'setup' || showLeaderboard) ? 'none' : 'inline-block';

  if(showLeaderboard){
    app.innerHTML = renderLeaderboard();
    attachLeaderboardHandlers();
    return;
  }

  let needsSave = false;

  // auto-corrección: una ronda "Perder" nunca debe quedar en fase de predicción
  if(state.phase === 'predict' && state.rounds[state.roundIdx] && isPerderRound(state.rounds[state.roundIdx])){
    state.predicciones = {};
    state.players.forEach((_,i)=>{ state.predicciones[i] = 0; });
    state.phase = 'result';
    needsSave = true;
  }

  // auto-corrección: puntajes de rondas "Perder" ya jugadas con la fórmula vieja
  if(healHistory()) needsSave = true;

  if(needsSave) saveState();

  if(state.phase === 'setup'){ app.innerHTML = renderSetup(); attachSetupHandlers(); return; }
  if(state.phase === 'finished'){ app.innerHTML = renderFinished(); attachCommonHandlers(); return; }
  if(state.phase === 'summary'){ app.innerHTML = renderRoundSummary(); attachSummaryHandlers(); attachCommonHandlers(); return; }
  app.innerHTML = renderGame();
  attachGameHandlers();
  attachCommonHandlers();
}

let avatars = {...DEFAULT_AVATARS};

function avatarHtml(name, size, inline){
  size = size || 32;
  const key = (name||'').trim();
  const src = key ? avatars[key] : null;
  const cls = inline ? 'avatar avatar-inline' : 'avatar';
  if(src){
    return `<img class="${cls}" style="width:${size}px;height:${size}px;" src="${src}">`;
  }
  const initial = key ? key[0].toUpperCase() : '?';
  return `<div class="${cls} avatar-placeholder" style="width:${size}px;height:${size}px;">${initial}</div>`;
}


function renderSetup(){
  const n = localDraft.numPlayers || 4;
  if(!localDraft.names) localDraft.names = [];
  if(!localDraft.nameMode) localDraft.nameMode = [];
  let nameInputs = '';
  for(let i=0;i<n;i++){
    const mode = localDraft.nameMode[i] || '';
    const val = localDraft.names[i] || '';
    let opts = `<option value="" ${mode==='' ? 'selected':''} disabled>Seleccionar jugador</option>`;
    opts += DEFAULT_NAMES.map(nm => {
      const takenByOther = localDraft.names.some((v,j)=> j!==i && localDraft.nameMode[j]==='preset' && v===nm);
      const selected = mode==='preset' && val===nm;
      return `<option value="${nm}" ${selected?'selected':''} ${takenByOther && !selected ? 'disabled':''}>${nm}${takenByOther && !selected ? ' (ya elegido)' : ''}</option>`;
    }).join('');
    opts += `<option value="__other__" ${mode==='other' ? 'selected':''}>Otro…</option>`;
    nameInputs += `
      <div class="name-slot">
        ${avatarHtml(val, 220).replace('class="avatar', 'class="avatar avatar-big')}
        <select class="name-select" data-idx="${i}">${opts}</select>
        <input type="text" class="name-input" data-idx="${i}" placeholder="Nombre" value="${escapeHtml(mode==='other' ? val : '')}" style="${mode==='other' ? '' : 'display:none;'}">
      </div>`;
  }
  let dealerOpts = '';
  for(let i=0;i<n;i++){
    const val = (localDraft.names && localDraft.names[i]) || `Jugador ${i+1}`;
    dealerOpts += `<option value="${i}">${escapeHtml(val)}</option>`;
  }
  return `
  <div class="card">
    <h2 style="margin-bottom:14px;">Nueva partida</h2>
    <label for="numPlayers">Cantidad de jugadores</label>
    <select id="numPlayers">
      ${[3,4,5,6,7].map(x=>`<option value="${x}" ${x===n?'selected':''}>${x} jugadores</option>`).join('')}
    </select>
    <div style="margin-top:16px;">
      <label>Nombres (en orden de predicción)</label>
      <div class="setup-players">${nameInputs}</div>
    </div>
    <div style="margin-top:16px;">
      <label for="startDealer">¿Quién reparte / es mano primero?</label>
      <select id="startDealer">${dealerOpts}</select>
    </div>
    <div style="margin-top:16px;">
      <label for="monto">Monto de la apuesta (lo que paga cada perdedor al ganador)</label>
      <input type="number" id="monto" min="0" step="1" placeholder="Ej: 2000" value="${localDraft.monto || ''}">
      <div style="font-size:12px;color:var(--muted); margin-top:4px;">Quien quede QUESO (42+ puntos abajo del ganador) paga el doble.</div>
    </div>
    <div class="footer-actions">
      <button class="btn-ghost" id="viewLeaderboardSetup">Ver historial de partidas</button>
      <button class="btn-primary" id="startGame">Empezar partida</button>
    </div>
  </div>`;
}

function playIntroAnimation(names, onComplete){
  suspendPoll = true;
  const overlay = document.createElement('div');
  overlay.id = 'introOverlay';

  const playersHtml = names.map((name,i)=>{
    const side = i % 2 === 0 ? 'intro-left' : 'intro-right';
    return `<div class="intro-player ${side}" style="animation-delay:${i*0.12}s;">
      ${avatarHtml(name, 110)}
      <div class="intro-name">${escapeHtml(name)}</div>
    </div>`;
  }).join('');

  overlay.innerHTML = `
    <div class="intro-grid">${playersHtml}</div>
    <div class="intro-vs">VS</div>
  `;
  document.body.appendChild(overlay);

  setTimeout(()=>{
    overlay.classList.add('intro-fadeout');
    setTimeout(()=>{
      overlay.remove();
      suspendPoll = false;
      onComplete();
    }, 450);
  }, 2100);
}

function attachSetupHandlers(){
  const vls = document.getElementById('viewLeaderboardSetup');
  if(vls) vls.addEventListener('click', ()=>{ showLeaderboard = true; render(); });
  const numSel = document.getElementById('numPlayers');
  numSel.addEventListener('change', e=>{
    localDraft.numPlayers = Number(e.target.value);
    render();
  });
  document.querySelectorAll('.name-select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.idx);
      if(e.target.value === '__other__'){
        localDraft.nameMode[idx] = 'other';
        localDraft.names[idx] = '';
      } else {
        localDraft.nameMode[idx] = 'preset';
        localDraft.names[idx] = e.target.value;
      }
      render();
    });
  });
  document.querySelectorAll('.name-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = Number(e.target.dataset.idx);
      localDraft.names[idx] = e.target.value;
    });
  });
  const dealerSel = document.getElementById('startDealer');
  dealerSel.addEventListener('change', e=>{ localDraft.startDealer = Number(e.target.value); });
  const montoInp = document.getElementById('monto');
  montoInp.addEventListener('input', e=>{ localDraft.monto = e.target.value; });

  document.getElementById('startGame').addEventListener('click', ()=>{
    const n = localDraft.numPlayers || 4;
    const names = [];
    for(let i=0;i<n;i++){
      const v = (localDraft.names && localDraft.names[i] || '').trim();
      names.push(v || `Jugador ${i+1}`);
    }
    state = {
      phase:'predict',
      players: names,
      startDealer: localDraft.startDealer || 0,
      monto: Number(localDraft.monto) || 0,
      rounds: buildRounds(n),
      roundIdx: 0,
      predicciones: {},
      resultados: {},
      history: []
    };
    localDraft = {};
    playIntroAnimation(names, ()=>{
      saveState();
      render();
    });
  });
}

function currentDealerIdx(){
  const n = state.players.length;
  return (state.startDealer + state.roundIdx) % n;
}

function forbiddenForLast(round, preds, lastIdx){
  const n = state.players.length;
  if(n < 2) return null;
  let sum = 0;
  for(let i=0;i<n;i++){
    if(i === lastIdx) continue;
    const v = preds[i];
    if(v === undefined || v === null || v === '') return null;
    sum += Number(v);
  }
  const forbidden = round.manos - sum;
  if(forbidden < 0 || forbidden > round.manos) return null;
  return forbidden;
}

function roundDetailHtml(idx){
  const round = state.rounds[idx];
  const h = state.history[idx];
  if(!round || !h) return '';
  const rows = state.players.map((name,i)=>`
    <div class="score-row">
      <div class="score-name">${avatarHtml(name,22,true)}${escapeHtml(name)}</div>
      <div style="flex:2; text-align:center; font-size:13px; color:var(--muted);">Predijo ${h.predicciones[i]} · Ganó ${h.resultados[i]}</div>
      <div class="score-pts">${h.scores[i]}</div>
    </div>`).join('');
  return `
    <div class="card" style="border:1px solid var(--gold); margin-top:10px;">
      <div class="round-title">
        <h3 style="font-size:17px;">Ronda ${idx+1} · ${escapeHtml(round.label)}</h3>
        <button class="btn-ghost" id="closeRoundDetail" style="padding:4px 10px;font-size:12px;">Cerrar</button>
      </div>
      ${rows}
    </div>`;
}

function renderGame(){
  const round = state.rounds[state.roundIdx];
  const dealerIdx = currentDealerIdx();
  const phase = state.phase; // 'predict' or 'result'
  const preds = state.predicciones;
  const lastIdx = (dealerIdx - 1 + state.players.length) % state.players.length;
  const forbidden = forbiddenForLast(round, preds, lastIdx);

  const track = state.rounds.map((r,i)=>{
    let cls = 'chip';
    if(i < state.roundIdx) cls += ' done';
    else if(i === state.roundIdx) cls += ' current';
    const clickable = i < state.roundIdx ? ` data-round-idx="${i}"` : '';
    return `<div class="${cls}"${clickable} title="${escapeHtml(r.label)}">${escapeHtml(r.short)}</div>`;
  }).join('');

  let playerRows = '';
  state.players.forEach((name,i)=>{
    const isMano = i === dealerIdx;
    const predVal = preds[i] !== undefined ? preds[i] : '';
    const resVal = state.resultados[i] !== undefined ? state.resultados[i] : '';
    let inputHtml;
    if(phase === 'predict'){
      const isLast = i === lastIdx;
      inputHtml = `<input type="number" min="0" max="${round.manos}" class="pred-input" data-idx="${i}" value="${predVal}" placeholder="0">`;
      const noteText = (isLast && forbidden!==null) ? `No puede decir ${forbidden}` : '';
      playerRows += `<div class="player-row">
        <div class="player-name">${avatarHtml(name,28,true)}${escapeHtml(name)} ${isMano ? '<span class="mano-badge">PARTE</span>' : ''}</div>
        <div>${inputHtml}${isLast ? `<div class="forbidden-note" id="forbiddenNote">${noteText}</div>` : ''}</div>
      </div>`;
    } else {
      inputHtml = `<input type="number" min="0" max="${round.manos}" class="res-input" data-idx="${i}" value="${resVal}" placeholder="0">`;
      playerRows += `<div class="player-row">
        <div class="player-name">${avatarHtml(name,28,true)}${escapeHtml(name)} ${isMano ? '<span class="mano-badge">PARTE</span>' : ''}</div>
        <div style="font-size:12px;color:var(--muted); text-align:center; margin-bottom:4px;">predijo ${preds[i]}</div>
        <div>${inputHtml}</div>
      </div>`;
    }
  });

  const resultSum = state.players.reduce((acc,_,i)=> acc + (state.resultados[i] !== undefined && state.resultados[i] !== '' ? Number(state.resultados[i]) : 0), 0);
  const allResultsFilled = state.players.every((_,i)=> state.resultados[i] !== undefined && state.resultados[i] !== '');
  const allPredsFilled = state.players.every((_,i)=> preds[i] !== undefined && preds[i] !== '');
  const lastPredIsForbidden = forbidden !== null && preds[lastIdx] !== undefined && preds[lastIdx] !== '' && Number(preds[lastIdx]) === forbidden;
  const canConfirmPredict = allPredsFilled && !lastPredIsForbidden;
  const canConfirmResult = allResultsFilled && resultSum === round.manos;

  return `
    <div class="card">
      <div class="round-title">
        <h2>Ronda ${state.roundIdx+1} de ${state.rounds.length} · ${escapeHtml(round.label)}</h2>
        <div class="phase-badge">${phase === 'predict' ? 'Predicciones' : 'Resultados'}</div>
      </div>
      <div class="round-sub">Manos en juego: ${round.manos}${isPerderRound(round) ? ' · Ronda especial: todos predicen 0. Si ganas 0 manos, +10 puntos; si ganas alguna, -2 por cada una' : ''}</div>
      <div class="track" style="margin-top:14px;">${track}</div>
      ${viewRoundIdx !== null ? roundDetailHtml(viewRoundIdx) : ''}
      <div style="margin-top:10px;">${playerRows}</div>
      ${phase === 'result' ? `<div class="forbidden-note" id="resultSumNote" style="text-align:right;">${allResultsFilled && !canConfirmResult ? `La suma de manos ganadas debe ser ${round.manos} (va en ${resultSum})` : ''}</div>` : ''}
      <div class="footer-actions">
        <div></div>
        ${phase === 'predict'
          ? `<button class="btn-primary" id="confirmPredict" ${canConfirmPredict?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>Confirmar predicciones</button>`
          : `<button class="btn-primary" id="confirmResult" ${canConfirmResult?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>Confirmar resultados</button>`}
      </div>
    </div>
    ${scoreboardBlockHtml()}
  `;
}

function scoreboardBlockHtml(){
  const totalsMap = totals();
  const sorted = state.players.map((name,i)=>({name, idx:i, total: totalsMap[i]}))
    .sort((a,b)=> b.total - a.total);
  const leaderTotal = sorted.length ? sorted[0].total : 0;

  let scoreboard = sorted.map((p,pos)=>{
    const diff = leaderTotal - p.total;
    const queso = diff >= 42 ? '<span class="queso">🧀 QUESO</span>' : '';
    const leaderTag = (p.total > 0 && p.total === leaderTotal) ? '<span class="leader-tag">¡Hay que bajarlo!</span>' : '';
    return `<div class="score-row">
      <div class="pos">${pos+1}</div>
      <div class="score-name">${avatarHtml(p.name,24,true)}${escapeHtml(p.name)}${queso}${leaderTag}</div>
      <div class="score-pts">${p.total}</div>
      <div class="score-diff">${pos===0 ? '' : '−'+diff}</div>
    </div>`;
  }).join('');

  let historyRows = '';
  state.history.forEach((h,ri)=>{
    historyRows += `<tr><td>${escapeHtml(state.rounds[ri].short)}</td>`;
    state.players.forEach((p,i)=>{
      const pr = h.predicciones[i];
      const rs = h.resultados[i];
      const sc = h.scores[i];
      historyRows += `<td>${pr}/${rs} <br><span style="color:var(--gold-soft)">${sc}</span></td>`;
    });
    historyRows += `</tr>`;
  });
  const historyTable = state.history.length ? `
    <details>
      <summary>Ver historial de rondas (${state.history.length})</summary>
      <table>
        <tr><th>Ronda</th>${state.players.map(p=>`<th>${escapeHtml(p)}</th>`).join('')}</tr>
        ${historyRows}
      </table>
    </details>` : '';

  return `
    <div class="card scoreboard">
      <h3 style="margin-bottom:10px;">Puntajes</h3>
      ${scoreboard || '<div class="empty-note">Aún no hay puntajes</div>'}
      ${historyTable}
    </div>`;
}

function renderRoundSummary(){
  const idx = state.roundIdx;
  const round = state.rounds[idx];
  const h = state.history[idx];
  const track = state.rounds.map((r,i)=>{
    let cls = 'chip';
    if(i < idx) cls += ' done';
    else if(i === idx) cls += ' current';
    const clickable = i < idx ? ` data-round-idx="${i}"` : '';
    return `<div class="${cls}"${clickable} title="${escapeHtml(r.label)}">${escapeHtml(r.short)}</div>`;
  }).join('');
  const rows = state.players.map((name,i)=>`
    <div class="player-row">
      <div class="player-name">${avatarHtml(name,28,true)}${escapeHtml(name)}</div>
      <div style="flex:2; text-align:center; font-size:13px; color:var(--muted);">Predijo ${h.predicciones[i]} · Ganó ${h.resultados[i]}</div>
      <div class="score-pts" style="min-width:56px; text-align:right;">${h.scores[i]}</div>

    <div class="card">

        <div class="phase-badge">Resultado de la ronda</div>
      </div>
      <div class="track" style="margin-top:14px;">${track}</div>
      ${viewRoundIdx !== null && viewRoundIdx !== idx ? roundDetailHtml(viewRoundIdx) : ''}

function attachSummaryHandlers(){
  document.querySelectorAll('.chip.done').forEach(ch=>{
    ch.addEventListener('click', e=>{
      const idx = Number(e.currentTarget.dataset.roundIdx);
      viewRoundIdx = (viewRoundIdx === idx) ? null : idx;
      render();
    });
  });
  const closeBtn = document.getElementById('closeRoundDetail');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ viewRoundIdx = null; render(); });
  const nextBtn = document.getElementById('nextRound');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    viewRoundIdx = null;
    if(state.roundIdx + 1 >= state.rounds.length){
      state.phase = 'finished';
    } else {
      state.roundIdx += 1;
      const round = state.rounds[state.roundIdx];
      if(isPerderRound(round)){
        state.predicciones = {};
        state.players.forEach((_,i)=>{ state.predicciones[i] = 0; });
        state.phase = 'result';
      } else {
        state.phase = 'predict';
      }
    }
    saveState();
    render();
  });
}

function formatCLP(n){
  try{ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n); }
  catch(e){ return '$'+n; }
}

function computeFinalStandings(){
  const totalsMap = totals();
  const sorted = state.players.map((name,i)=>({name, idx:i, total: totalsMap[i]}))
    .sort((a,b)=> b.total - a.total);
  const winner = sorted[0];
  const n = state.players.length;
  let quesoCount = 0;
  const standings = sorted.map((p,pos)=>{
    const diff = winner ? winner.total - p.total : 0;
    const isQueso = pos > 0 && diff >= 42;
    const exempt = pos === 1 && n >= 4 && !isQueso; // 2do lugar no paga en partidas de 4+, salvo que también sea QUESO
    let owes = 0;
    if(pos > 0 && state.monto > 0 && !exempt){
      owes = isQueso ? (state.monto * 2 + quesoCount * 1000) : state.monto;
    }
    if(isQueso && !exempt) quesoCount += 1;
    return { name: p.name, total: p.total, position: pos+1, isQueso, owes, exempt };
  });
  return { winner, standings };
}

function renderFinished(){
  const { winner, standings } = computeFinalStandings();
  let rows = standings.map(p=>`
    <div class="score-row">
      <div class="pos">${p.position}</div>
      <div class="score-name">${avatarHtml(p.name,24,true)}${escapeHtml(p.name)} ${p.isQueso ? '<span class="queso">🧀 QUESO</span>' : ''}</div>
      <div class="score-pts">${p.total}</div>
    </div>`).join('');

  let payoutSection = '';
  if(state.monto > 0 && winner){
    const losers = standings.filter(p=>p.position > 1 && !p.exempt);
    const payoutRows = losers.map(p=>`
      <div class="score-row">
        <div class="score-name">${avatarHtml(p.name,24,true)}${escapeHtml(p.name)} ${p.isQueso ? '<span class="queso">🧀 QUESO</span>' : ''}</div>
        <div class="score-pts" style="font-size:16px;">${formatCLP(p.owes)}</div>
      </div>`).join('');
    const total = losers.reduce((acc,p)=> acc + p.owes, 0);
    payoutSection = `
    <div class="card scoreboard">
      <h3 style="margin-bottom:10px;">Pagos a ${escapeHtml(winner.name)}</h3>
      ${payoutRows}
      <div class="score-row" style="border-top:1px solid var(--line); margin-top:4px; padding-top:12px;">
        <div class="score-name" style="color:var(--gold-soft);">Total a cobrar</div>
        <div class="score-pts">${formatCLP(total)}</div>
      </div>
    </div>`;
  }

  return `
    <div class="card" style="text-align:center;">
      <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;">Partida terminada</div>
      <h2 style="font-size:30px; color:var(--gold-soft); margin:8px 0 4px;">🏆 ${escapeHtml(winner ? winner.name : '')}</h2>
      <div style="color:var(--muted); font-size:14px;">Ganador con ${winner ? winner.total : 0} puntos</div>
    </div>
    <div class="card scoreboard">
      <h3 style="margin-bottom:10px;">Resultado final</h3>
      ${rows}
    </div>
    ${payoutSection}
    <div class="footer-actions">
      <button class="btn-ghost" id="viewLeaderboard">Ver historial de partidas</button>
      <div style="display:flex; gap:10px;">
        <button class="btn-ghost" id="saveGameBtn">Guardar partida</button>
        <button class="btn-primary" id="resetGame">Nueva partida</button>
      </div>
    </div>
  `;
}

function setButtonEnabled(btn, enabled){
  if(!btn) return;
  btn.disabled = !enabled;
  btn.style.opacity = enabled ? '1' : '.5';
  btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
}

function updatePredictUI(){
  const round = state.rounds[state.roundIdx];
  const dealerIdx = currentDealerIdx();
  const lastIdx = (dealerIdx - 1 + state.players.length) % state.players.length;
  const forbidden = forbiddenForLast(round, state.predicciones, lastIdx);
  const noteEl = document.getElementById('forbiddenNote');
  if(noteEl) noteEl.textContent = forbidden !== null ? `No puede decir ${forbidden}` : '';
  const allFilled = state.players.every((_,i)=> state.predicciones[i] !== undefined && state.predicciones[i] !== '');
  const lastVal = state.predicciones[lastIdx];
  const lastIsForbidden = forbidden !== null && lastVal !== undefined && lastVal !== '' && Number(lastVal) === forbidden;
  const canConfirm = allFilled && !lastIsForbidden;
  setButtonEnabled(document.getElementById('confirmPredict'), canConfirm);
}

function updateResultUI(){
  const round = state.rounds[state.roundIdx];
  const resultSum = state.players.reduce((acc,_,i)=> acc + (state.resultados[i] !== undefined && state.resultados[i] !== '' ? Number(state.resultados[i]) : 0), 0);
  const allFilled = state.players.every((_,i)=> state.resultados[i] !== undefined && state.resultados[i] !== '');
  const canConfirm = allFilled && resultSum === round.manos;
  const noteEl = document.getElementById('resultSumNote');
  if(noteEl) noteEl.textContent = (allFilled && !canConfirm) ? `La suma de manos ganadas debe ser ${round.manos} (va en ${resultSum})` : '';
  setButtonEnabled(document.getElementById('confirmResult'), canConfirm);
}

function biddingOrder(){
  const dealerIdx = currentDealerIdx();
  const n = state.players.length;
  const order = [];
  for(let k=0;k<n;k++) order.push((dealerIdx+k) % n);
  return order;
}

function attachEnterAdvance(selector, confirmBtnId){
  const order = biddingOrder();
  document.querySelectorAll(selector).forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const idx = Number(inp.dataset.idx);
      const pos = order.indexOf(idx);
      const nextIdx = order[pos+1];
      if(nextIdx !== undefined){
        const nextInput = document.querySelector(`${selector}[data-idx="${nextIdx}"]`);
        if(nextInput){ nextInput.focus(); nextInput.select(); }
      } else {
        const btn = document.getElementById(confirmBtnId);
        if(btn && !btn.disabled) btn.click();
        else inp.blur();
      }
    });
  });
}

function attachGameHandlers(){
  if(state.phase === 'predict'){
    const dealerIdx = currentDealerIdx();
    const manoInput = document.querySelector(`.pred-input[data-idx="${dealerIdx}"]`);
    if(manoInput && document.activeElement !== manoInput){
      manoInput.focus();
      if(manoInput.value) manoInput.select();
    }
  }
  if(state.phase === 'result'){
    const dealerIdx = currentDealerIdx();
    const manoInput = document.querySelector(`.res-input[data-idx="${dealerIdx}"]`);
    if(manoInput && document.activeElement !== manoInput){
      manoInput.focus();
      if(manoInput.value) manoInput.select();
    }
  }
  document.querySelectorAll('.chip.done').forEach(ch=>{
    ch.addEventListener('click', e=>{
      const idx = Number(e.currentTarget.dataset.roundIdx);
      viewRoundIdx = (viewRoundIdx === idx) ? null : idx;
      render();
    });
  });
  const closeBtn = document.getElementById('closeRoundDetail');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ viewRoundIdx = null; render(); });
  document.querySelectorAll('.pred-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = Number(e.target.dataset.idx);
      state.predicciones[i] = e.target.value === '' ? '' : Number(e.target.value);
      updatePredictUI();
      saveState(true);
    });
  });
  document.querySelectorAll('.res-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = Number(e.target.dataset.idx);
      state.resultados[i] = e.target.value === '' ? '' : Number(e.target.value);
      updateResultUI();
      saveState(true);
    });
  });
  attachEnterAdvance('.pred-input', 'confirmPredict');
  attachEnterAdvance('.res-input', 'confirmResult');
  const cp = document.getElementById('confirmPredict');
  if(cp) cp.addEventListener('click', ()=>{
    state.phase = 'result';
    saveState();
    render();
  });
  const cr = document.getElementById('confirmResult');
  if(cr) cr.addEventListener('click', ()=>{
    const round = state.rounds[state.roundIdx];
    const scores = {};
    state.players.forEach((_,i)=>{
      scores[i] = pts(state.predicciones[i], state.resultados[i], round);
    });
    state.history.push({
      predicciones: {...state.predicciones},
      resultados: {...state.resultados},
      scores
    });
    state.predicciones = {};
    state.resultados = {};
    viewRoundIdx = null;
    state.phase = 'summary';
    saveState();
    render();
  });
}

function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.id = 'confirmOverlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-msg">${escapeHtml(message)}</div>
      <div class="confirm-actions">
        <button class="btn-ghost" id="confirmNo">Cancelar</button>
        <button class="btn-primary" id="confirmYes">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('confirmNo').addEventListener('click', ()=> overlay.remove());
  document.getElementById('confirmYes').addEventListener('click', ()=>{ overlay.remove(); onConfirm(); });
}

    state = emptyState();

    saveState();
    render();

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const LEADERBOARD_KEY = 'predicciones-leaderboard-v1';
let leaderboard = [];
let showLeaderboard = false;

async function loadLeaderboard(){
  try{
    const res = await dbStorage.get(LEADERBOARD_KEY);
    if(res && res.value) leaderboard = JSON.parse(res.value);
  }catch(e){}
}
async function saveLeaderboard(){
  try{ await dbStorage.set(LEADERBOARD_KEY, JSON.stringify(leaderboard)); }catch(e){}
}

function buildGameEntry(){
  const { winner, standings } = computeFinalStandings();
  return {
    id: Date.now(),
    date: new Date().toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit', year:'numeric'}),
    monto: state.monto || 0,
    winner: winner ? winner.name : '',
    standings
  };
}

function buildBalanceHtml(){
  const allNames = [];
  leaderboard.forEach(g=> g.standings.forEach(p=>{ if(!allNames.includes(p.name)) allNames.push(p.name); }));
  const gamesChrono = [...leaderboard].reverse(); // más antigua primero, para leer de izquierda a derecha

  const netFor = (g, p)=> (p.name === g.winner)
    ? g.standings.reduce((acc,s)=> s.name !== g.winner ? acc + s.owes : acc, 0)
    : -p.owes;

  const cellHtml = (net)=>{
    if(net === null) return `<td style="color:var(--muted);">—</td>`;
    if(net === 0) return `<td style="color:var(--muted);">${formatCLP(0)}</td>`;
    const cls = net > 0 ? 'color:#8fd9ac;' : 'color:var(--coral);';
    const sign = net > 0 ? '+' : '';
    return `<td style="${cls}">${sign}${formatCLP(net)}</td>`;
  };

  const cumulativeCellHtml = (net)=>{
    const cls = net > 0 ? 'color:#8fd9ac;' : net < 0 ? 'color:var(--coral);' : 'color:var(--muted);';
    const sign = net > 0 ? '+' : '';
    return `<td style="font-weight:700; ${cls}">${net === 0 ? formatCLP(0) : sign+formatCLP(net)}</td>`;
  };

  const header = `<tr><th>Jugador</th>${gamesChrono.map(g=>`<th>${escapeHtml(g.date)}</th>`).join('')}<th>Acumulado</th></tr>`;
  const rows = allNames.map(name=>{
    let cumulative = 0;
    const cells = gamesChrono.map(g=>{
      const p = g.standings.find(s=>s.name===name);
      if(!p) return cellHtml(null);
      const net = netFor(g,p);
      cumulative += net;
      return cellHtml(net);
    }).join('');
    return `<tr><td>${avatarHtml(name,18,true)}${escapeHtml(name)}</td>${cells}${cumulativeCellHtml(cumulative)}</tr>`;
  }).join('');

  return `
    <div class="card scoreboard">
      <h3 style="margin-bottom:10px;">Saldos por partida</h3>
      <div style="overflow-x:auto;">
        <table style="min-width:100%;">
          ${header}
          ${rows}
        </table>
      </div>
    </div>`;
}

function renderLeaderboard(){
  if(!leaderboard.length){
    return `
      <div class="card">
        <div class="round-title"><h2>Historial de partidas</h2><button class="btn-ghost" id="closeLeaderboard">Volver</button></div>
        <div class="empty-note">Todavía no hay partidas guardadas.</div>
      </div>`;
  }
  const wins = {};
  leaderboard.forEach(g=>{ wins[g.winner] = (wins[g.winner]||0) + 1; });
  const winsRows = Object.entries(wins).sort((a,b)=>b[1]-a[1]).map(([name,count])=>`
    <div class="score-row">
      <div class="score-name">${avatarHtml(name,22,true)}${escapeHtml(name)}</div>
      <div class="score-pts" style="font-size:16px;">${count} 🏆</div>
    </div>`).join('');

  const games = leaderboard.map(g=>{
    const rows = g.standings.map(p=>`
      <div class="score-row">
        <div class="pos">${p.position}</div>
        <div class="score-name">${avatarHtml(p.name,20,true)}${escapeHtml(p.name)} ${p.isQueso ? '<span class="queso">🧀</span>' : ''}</div>
        <div class="score-pts" style="font-size:15px;">${p.total}</div>
        <div class="score-diff">${p.owes ? formatCLP(p.owes) : ''}</div>
      </div>`).join('');
    return `
      <div class="card scoreboard">
        <div class="round-title">
          <h3 style="font-size:16px;">🏆 ${escapeHtml(g.winner)} · ${escapeHtml(g.date)}</h3>
          <button class="btn-danger delete-game" data-id="${g.id}" title="Eliminar partida" style="padding:4px 10px; font-size:12px;">✕</button>
        </div>
        ${rows}
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="round-title"><h2>Historial de partidas</h2><button class="btn-ghost" id="closeLeaderboard">Volver</button></div>
    </div>
    <div class="card scoreboard">
      <h3 style="margin-bottom:10px;">Victorias por jugador</h3>
      ${winsRows}
    </div>
    ${buildBalanceHtml()}
    ${games}
  `;
}

function attachLeaderboardHandlers(){
  const closeBtn = document.getElementById('closeLeaderboard');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ showLeaderboard = false; render(); });
  document.querySelectorAll('.delete-game').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = Number(e.currentTarget.dataset.id);
      showConfirm('¿Eliminar esta partida del historial? Esto no se puede deshacer.', async ()=>{
        leaderboard = leaderboard.filter(g=> g.id !== id);
        await saveLeaderboard();
        render();
      });
    });
  });
}

const STORAGE_KEY = 'predicciones-game-v1';
let saving = false;
let suspendPoll = false; // true mientras se muestra la animación de inicio, para no pisar el estado nuevo

async function saveState(silent){
  if(!firebaseReady){
    const tag = document.getElementById('syncTag');
    if(tag) tag.textContent = 'guardado no disponible aquí';
    return;
  }
  try{
    saving = true;
    const res = await dbStorage.set(STORAGE_KEY, JSON.stringify(state));
    document.getElementById('syncTag') && (document.getElementById('syncTag').textContent = res ? 'sincronizado ✓' : 'error al guardar');
  }catch(e){
    const tag = document.getElementById('syncTag');
    if(tag) tag.textContent = 'sin conexión';
  }finally{
    saving = false;
  }
}

async function loadState(){
  const tag = document.getElementById('syncTag');
  if(!firebaseReady){
    if(tag) tag.textContent = 'guardado no disponible aquí';
    render();
    return;
  }
  try{
    const res = await dbStorage.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
    if(tag) tag.textContent = 'sincronizado ✓';
  }catch(e){
    if(tag) tag.textContent = 'sin conexión';
  }
  render();
}

// poll for updates from other players every 5s, but don't stomp on active typing
setInterval(async ()=>{
  if(saving || suspendPoll) return;
  const active = document.activeElement;
  if(active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')) return;
  try{
    const res = await dbStorage.get(STORAGE_KEY);
    if(res && res.value){
      const remote = JSON.parse(res.value);
      if(JSON.stringify(remote) !== JSON.stringify(state)){
        state = remote;
        render();
      }
    }
  }catch(e){}
}, 5000);

document.getElementById('topReset').addEventListener('click', doReset);

loadLeaderboard();
loadState();
</script>
